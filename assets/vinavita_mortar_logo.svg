            <!-- 3. Subtle Dong Son Sunburst Halo Behind Mortar -->
            <g opacity="0.24" stroke="#fbbf24" stroke-width="1.3">
              <circle cx="100" cy="102" r="56" fill="none" stroke-dasharray="3 5" />
              <line x1="100" y1="34" x2="100" y2="46" />
              <line x1="52" y1="54" x2="61" y2="63" />
              <line x1="148" y1="54" x2="139" y2="63" />
              <line x1="34" y1="102" x2="46" y2="102" />
              <line x1="166" y1="102" x2="154" y2="102" />
            </g>

