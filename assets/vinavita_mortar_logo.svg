            <polygon points="100,181 105,189 100,197 95,189" fill="#fef08a" />
            <polygon points="3,100 11,95 19,100 11,105" fill="#34d399" />
            <polygon points="181,100 189,95 197,100 189,105" fill="#34d399" />

