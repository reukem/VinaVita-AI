<svg class="brand-emblem-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VinaVita Royal Botanical Crest">
            <defs>
              <!-- Imperial Gold & Champagne Bezel Gradient -->
              <linearGradient id="vvGoldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fef08a" />
                <stop offset="30%" stop-color="#fbbf24" />
                <stop offset="55%" stop-color="#34d399" />
                <stop offset="80%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#fef08a" />
              </linearGradient>
              <!-- Animated Luminous Mortar & Pestle Gradient -->
              <linearGradient id="vvMortarGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff">
                  <animate attributeName="stop-color" values="#ffffff;#fef08a;#a7f3d0;#ffffff" dur="5s" repeatCount="indefinite" />
                </stop>
                <stop offset="45%" stop-color="#fef08a">
                  <animate attributeName="stop-color" values="#fef08a;#fbbf24;#ffffff;#fef08a" dur="5s" repeatCount="indefinite" />
                </stop>
                <stop offset="80%" stop-color="#6ee7b7">
                  <animate attributeName="stop-color" values="#6ee7b7;#34d399;#fef08a;#6ee7b7" dur="5s" repeatCount="indefinite" />
                </stop>
                <stop offset="100%" stop-color="#fbbf24" />
              </linearGradient>
              <!-- Bioluminescent Jade-Emerald Leaf Fill Gradient -->
              <linearGradient id="vvJadeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.92" />
                <stop offset="55%" stop-color="#10b981" stop-opacity="0.88" />
                <stop offset="100%" stop-color="#047857" stop-opacity="0.95" />
              </linearGradient>
              <!-- Bowl Interior Herbal Elixir Glow -->
              <radialGradient id="vvElixirCore" cx="55%" cy="40%" r="65%">
                <stop offset="0%" stop-color="#34d399" stop-opacity="0.48" />
                <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.22" />
                <stop offset="100%" stop-color="#042f1e" stop-opacity="0.65" />
              </radialGradient>
              <!-- Deep Imperial Jade Obsidian Sanctuary Background -->
              <radialGradient id="vvSanctuaryBg" cx="50%" cy="45%" r="60%">
                <stop offset="0%" stop-color="#0d4a33" />
                <stop offset="65%" stop-color="#052619" />
                <stop offset="100%" stop-color="#02130c" />
              </radialGradient>
              <!-- Soft Golden-Emerald Drop Shadow -->
              <filter id="vvCrestGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10b981" flood-opacity="0.55" />
              </filter>
            </defs>

            <!-- 1. Outer Sculpted Octagonal Imperial Seal Base (Not a generic circle!) -->
            <polygon points="60,8 140,8 192,60 192,140 140,192 60,192 8,140 8,60"
                     fill="url(#vvSanctuaryBg)" stroke="url(#vvGoldBezel)" stroke-width="4.5" stroke-linejoin="round" />

            <!-- 2. Stepped Inner Royal Filigree Octagon & Corner Brackets -->
            <polygon points="65,18 135,18 182,65 182,135 135,182 65,182 18,135 18,65"
                     fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="6 4" stroke-opacity="0.65" />
            <!-- Ornate Corner Filigree Accents -->
            <path d="M 46,24 L 63,13 L 78,13 M 122,13 L 137,13 L 154,24 M 176,46 L 187,63 L 187,78 M 187,122 L 187,137 L 176,154 M 154,176 L 137,187 L 122,187 M 78,187 L 63,187 L 46,176 M 24,154 L 13,137 L 13,122 M 13,78 L 13,63 L 24,46"
